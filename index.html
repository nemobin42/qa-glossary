<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이슈 리포트 용어 사전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/ui-demo.css">
<link rel="stylesheet" href="css/status-demo.css">
</head>
<body>
<div class="wrap">
  <nav class="site-nav" aria-label="사전 종류">
    <a class="brand" href="#ui">이슈 리포트 용어 사전</a>
    <div class="gnb-tabs"><a href="#ui" data-s="ui">UI/UX 용어</a><a href="#http" data-s="http">HTTP 상태 코드</a></div>
  </nav>
  <!-- 문구는 사전별로 app.js의 DICTS에서 채움 -->
  <header class="hero">
    <span class="eyebrow" id="eyebrow"></span>
    <h1 id="h1"></h1>
    <p class="lede" id="lede"></p>
  </header>

  <div class="toolbar">
    <label class="search" for="q">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <div class="cats" id="cats" role="group" aria-label="분류"></div>
    <span class="count" id="count"></span>
  </div>

  <main class="grid" id="grid"></main>
  <footer id="foot"></footer>
</div>

<div class="overlay" id="ov" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <div class="d-stage"><div id="d-demo"></div><span class="note" id="d-note"></span></div>
    <div class="d-body">
      <div class="d-head">
        <div><span class="cat" id="d-cat"></span>
        <h2 id="d-title"></h2><span class="en" id="d-en"></span></div>
        <button class="close" id="d-close" aria-label="닫기">✕</button>
      </div>
      <section><h4>설명</h4><p id="d-desc"></p></section>
      <section id="d-when-s"><h4>이럴 때 보여요</h4><ul id="d-when"></ul></section>
      <section id="d-tip-s"><h4>보고할 때 팁</h4><p id="d-tip"></p></section>
      <section><h4 id="d-rel-h"></h4><div class="rels" id="d-rels"></div></section>
    </div>
  </div>
</div>

<script src="js/ui-terms.js"></script>
<script src="js/status-codes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
